  rails:
    build: .
    container_name: climb-journal-api
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PW: ${DATABASE_PW}
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../climb_journal_web/climb-journal-web
      dockerfile: Dockerfile.dev
    container_name: climb-journal-web
    develop:
      watch:
        - action: sync
          path: ../climb_journal_web/climb-journal-web
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ../climb_journal_web/climb-journal-web/package.json
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
    depends_on:
      rails:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: