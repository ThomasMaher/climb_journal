services:
  db:
    image: postgres:18
    container_name: climb-journal-db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PW}
      POSTGRES_DB: climb_journal_development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  rails:
    build: .
    container_name: climb-journal-api
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PW: ${DATABASE_PW}
      RAILS_ENV: development

volumes:
  postgres-data: